[platformio]
; Fuentes en Windows, compilacion y librerias en el disco de Linux (WSL)
workspace_dir = /home/pablo/.pio_workspaces/purple_deck

[env:purple_deck]
; Arduino-ESP32 3.x via pioarduino (verifica la URL en el README de pioarduino)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; WT32-SC01-Plus: ESP32-S3, 16 MB flash, 2 MB PSRAM
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qio
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

; Serial por el USB nativo (Serial.printf llega al monitor)
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  ; 5 = STORAGE_SD en FtpServerKey.h (SimpleFTPServer): sirve archivos desde la
  ; tarjeta SD en vez del valor por defecto (STORAGE_FFAT)
  -DDEFAULT_STORAGE_TYPE_ESP32=5

; El teclado Bluetooth (macros) vive en lib/ESP32-NimBLE-Keyboard
lib_deps =
  lovyan03/LovyanGFX
  h2zero/NimBLE-Arduino@^2.1.0
  xreef/SimpleFTPServer

monitor_speed = 115200
