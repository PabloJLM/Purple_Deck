[platformio]
; Fuentes en Windows, compilacion y librerias en el disco de Linux (WSL)
workspace_dir = /home/pablo/.pio_workspaces/purple_deck

[env:purple_deck]
; Arduino-ESP32 3.x via pioarduino (verifica la URL en el README de pioarduino)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; WT32-SC01-Plus: ESP32-S3, 16 MB flash, 2 MB PSRAM
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

lib_deps = lovyan03/LovyanGFX

monitor_speed = 115200
